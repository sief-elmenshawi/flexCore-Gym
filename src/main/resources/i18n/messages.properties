error.access-denied=You do not have permission to perform this action
error.validation-failed=Validation failed
error.param-invalid=Invalid request parameter: {0}
error.body-malformed=Malformed request body
error.body-invalid-enum=Invalid value "{0}" for field "{1}". Allowed values: {2}
