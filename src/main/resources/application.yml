server:
  compression:
    enabled: true
    min-response-size: 2048

spring:
  application:
    name: flexcore

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/flexcore}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # Sized for ~500 members at peak (≈50 RPS × ~3 queries × ~10ms → 2-8 concurrent DB
      # queries). 10 gives comfortable headroom; going bigger only queues queries.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      # Fail fast instead of hanging members: 10s rather than Hikari's 30s default.
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT_MS:10000}
      # Keep below the database's idle kill (>=30min on managed Postgres) so pooled
      # connections are never silently dropped mid-use.
      max-lifetime: ${HIKARI_MAX_LIFETIME_MS:1800000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT_MS:600000}
      pool-name: flexcore-hikari

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # SQL logging belongs to the 'dev' profile (see application-dev.yml): in the default
    # / production configuration every query must not be written to the logs.
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
    web:
      pageable:
        one-indexed-parameters: true
        max-page-size: 100

  cache:
    type: redis
    redis:
      time-to-live: 7200000
      key-prefix: "flexcore:"
      use-key-prefix: true
      cache-null-values: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-change-this-secret-in-production}
    access-token-expiration-ms: 900000      # 15 min
  security:
    login-rate-limit:
      max-failed-attempts: 5          # failures allowed per window before blocking
      failure-window-minutes: 15
      block-minutes: 5                # how long further logins are rejected
  jobs:
    subscription-maintenance-cron: "0 */30 * * * *"   # thaw elapsed freezes + expire overdue
