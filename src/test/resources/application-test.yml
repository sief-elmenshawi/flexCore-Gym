spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/flexcore_test
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

management:
  opentelemetry:
    enabled: false
  tracing:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false

app:
  jwt:
    # Strong test signing key (>= 32 bytes); the placeholder in application.yml is
    # rejected by JwtTokenProvider to force real secrets in every environment.
    secret: ${JWT_TEST_SECRET:test-secret-which-is-long-enough-for-hs256-signing-1234567890}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  jobs:
    # Integration tests drive the outbox publisher manually; keep the real scheduler out.
    outbox-poll-enabled: false
    outbox-poll-delay-ms: 60000
  rabbit:
    # Default off in tests so the in-app logging handler takes over and no listener
    # container tries to reach a broker. The Rabbit integration test flips it on.
    enabled: false
